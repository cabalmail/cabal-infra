---
name: Lint

# Run the code linters/scanners on every pull request so failures surface at
# review time instead of after merge. The deploy workflows (infra.yml,
# app.yml, apple.yml) only fire on pushes to the three named branches, so
# before this workflow a feature-branch or claude/* PR could pass review with
# lint errors that only blew up once promoted to stage/main. This mirrors the
# checks those deploy workflows run at merge time:
#
#   - Terraform: tflint + checkov + trivy, both the dns and infra stacks
#                (from infra.yml), using the same pinned tool versions,
#                shared tflint config, per-stack checkov/trivy configs, and
#                baseline/ignore drift checks; plus init/validate (new for the
#                PR gate — no deploy workflow validates before its plan).
#   - Python:    pylint over lambda/api and lambda/counter (from app.yml),
#                plus the lambda/api/_shared unittest suites (new for the PR
#                gate; no deploy workflow runs them).
#   - Swift:     swiftlint --strict (from apple.yml).
#   - React:     eslint (new for the PR gate; the deploy path only builds).
#   - Rust:      cargo xtask ci (new for the PR gate; there is no Linux deploy
#                workflow yet — the Phase 2 linux.yml will invoke this same
#                subcommand, see linux/xtask/src/ci.rs, so the two can't
#                drift).
#   - Kotlin:    the Android client's full quality gate — kit + app unit
#                tests, ktlint, Android Lint with warnings-as-errors — the
#                same single gradle invocation android.yml's test job runs at
#                merge time, so the two can't drift.
#
# This is lint-only: no AWS credentials, no Terraform backend, no deploy. The
# Terraform scanners read the committed source directly (exactly as the
# infra.yml scanner jobs do), so they need neither a generated backend.tf nor
# OIDC. Each area is path-filtered so a PR only runs the linters it can affect.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # dorny/paths-filter lists the PR's changed files via the pulls API on
  # pull_request events.
  pull-requests: read

# Supersede in-flight lint runs when a PR is updated; a stale lint result is
# never worth finishing. Keyed on the PR number so concurrent PRs don't cancel
# each other.
concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      python: ${{ steps.filter.outputs.python }}
      swift: ${{ steps.filter.outputs.swift }}
      react: ${{ steps.filter.outputs.react }}
      rust: ${{ steps.filter.outputs.rust }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: filter
      id: filter
      # On pull_request, dorny/paths-filter diffs against the PR base branch
      # automatically (no `base:` needed). Changing lint.yml itself runs every
      # area so the workflow can be validated against real code in one PR.
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      with:
        filters: |
          terraform:
            - 'terraform/**'
            - '.github/scripts/check-suppression-justifications.sh'
            - '.github/scripts/check-iam-resource-scope.py'
            - '.github/scripts/baseline-diff.py'
            - '.github/scripts/terraform-validate.sh'
            - '.github/workflows/lint.yml'
          python:
            - 'lambda/**'
            # The user-mail-rules procmail compiler and its corpus tests
            # live with the container sources but gate here.
            - 'docker/shared/**'
            - '.github/workflows/lint.yml'
          swift:
            - 'apple/**'
            - '.github/workflows/lint.yml'
          react:
            - 'react/admin/**'
            - '.github/workflows/lint.yml'
          rust:
            - 'linux/**'
            # The xtask repo-shape tests assert the client's synced-preference
            # keys match this Lambda's APP_ALLOWED set, so an edit on the
            # Lambda side must run the Rust gate too.
            - 'lambda/api/set_preferences/function.py'
            - '.github/workflows/lint.yml'
          kotlin:
            - 'android/**'
            - '.github/workflows/lint.yml'

  # ---------------------------------------------------------------------------
  # Terraform. One job per tool, fanned out over both stacks via the matrix.
  # Mirrors the infra.yml scanner jobs step-for-step, minus the SARIF upload to
  # GitHub code scanning: on a PR the gate is the failed check itself, so the
  # code-scanning surfacing (and its fork-permission complications) is dropped.
  # Both stacks are scanned whenever any terraform/** path changes; scanning an
  # untouched stack is cheap and the shared tflint config couples them anyway.
  # ---------------------------------------------------------------------------
  checkov:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [dns, infra]
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: check-suppression-justifications
      run: ./.github/scripts/check-suppression-justifications.sh terraform/${{ matrix.stack }}
    - name: check-iam-resource-scope
      run: ./.github/scripts/check-iam-resource-scope.py terraform/${{ matrix.stack }}
    - name: setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: install-checkov
      run: pip install checkov==3.2.530
    - name: checkov
      # Same invocation as the infra.yml chekov / checkov_dns jobs and the
      # local `make scan` runner: --config-file applies the CMK skip-check,
      # --baseline grandfathers residual findings, so checkov exits non-zero
      # (failing the PR check) only on a NEW finding not in the baseline.
      run: >
        checkov -d terraform/${{ matrix.stack }}
        --config-file terraform/${{ matrix.stack }}/.checkov.yaml
        --baseline terraform/${{ matrix.stack }}/.checkov.baseline
        --compact
        -o cli
    - name: baseline-drift
      # Fail if a .checkov.baseline entry no longer matches a finding (stale:
      # the code was fixed but the grandfather entry was left behind).
      run: |
        checkov -d terraform/${{ matrix.stack }} --config-file terraform/${{ matrix.stack }}/.checkov.yaml \
          --soft-fail --compact --quiet -o json > "$RUNNER_TEMP/checkov-all.json"
        python3 .github/scripts/baseline-diff.py checkov "$RUNNER_TEMP/checkov-all.json" terraform/${{ matrix.stack }}/.checkov.baseline

  tflint:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [dns, infra]
    env:
      # tflint does not search parent dirs; point it at the shared config
      # explicitly. Absolute path because --recursive lints each subdir.
      TFLINT_CONFIG_FILE: ${{ github.workspace }}/terraform/.tflint.hcl
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: install-tflint
      uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a  # v6.3.0
      with:
        tflint_version: v0.63.1
    - name: init-tflint
      run: tflint --init
    - name: run-linter
      # tflint exits 2 on any finding, failing the PR check. The stacks are at
      # zero findings; a new one fails CI. Mirrors infra.yml / `make scan`.
      run: tflint --chdir=terraform/${{ matrix.stack }} --recursive

  trivy:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [dns, infra]
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        scan-type: config
        scan-ref: terraform/${{ matrix.stack }}
        format: table
        # Pin the trivy binary so gate strictness only changes by a deliberate
        # bump (the action SHA pins the wrapper, not the binary). Matches the
        # version the baseline was verified against.
        version: v0.71.0
        trivyignores: terraform/${{ matrix.stack }}/.trivyignore
        # Exit 1 on any finding not in the ignorefile, failing the PR check.
        exit-code: '1'
    - name: ignore-drift
      # Fail if a .trivyignore id no longer matches a finding (stale). The
      # trivy binary (pinned above) is on PATH from the action.
      run: |
        trivy config terraform/${{ matrix.stack }} --format json --quiet > "$RUNNER_TEMP/trivy-all.json"
        python3 .github/scripts/baseline-diff.py trivy "$RUNNER_TEMP/trivy-all.json" terraform/${{ matrix.stack }}/.trivyignore

  validate:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [dns, infra]
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: setup-terraform
      # Same pinned action and wrapper-off setting as infra.yml's three
      # setup-terraform steps; nothing here consumes the wrapper's outputs.
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      with:
        terraform_wrapper: false
    - name: terraform-validate
      # init/validate resolve the module graph, which the scanners never do: a
      # module argument with no matching variable is invisible to them (#962).
      # -backend=false means no credentials and no generated backend.tf.
      run: ./.github/scripts/terraform-validate.sh terraform/${{ matrix.stack }}

  # ---------------------------------------------------------------------------
  # Python. Same pylint invocations app.yml runs in the lambda-api and
  # lambda-counter deploy jobs (counter borrows api's .pylintrc).
  # ---------------------------------------------------------------------------
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: install-pylint
      run: pip install pylint
    - name: pylint-api
      run: cd ./lambda/api && pylint --rcfile .pylintrc _shared/*.py */function.py push_dispatch/apns.py push_dispatch/fcm.py
    - name: pylint-counter
      run: pylint --rcfile ./lambda/api/.pylintrc ./lambda/counter/*/function.py
    - name: unittest-shared
      # The _shared suites fake their third-party deps (imapclient, boto3) via
      # sys.modules, so they run on a bare interpreter — no pip install needed.
      # Same invocation as the docstring in each test file; suites are
      # import-order independent since #863.
      run: python3 -m unittest discover -s lambda/api/_shared/tests -p "test_*.py"
    - name: unittest-rules-compiler
      # Golden-file + injection-corpus tests for the procmail rule compiler
      # (docs/1.x/user-mail-rules-plan.md, Phase 2). Pure stdlib; the same
      # golden assertion also runs in the imap image build and at container
      # start-up via compile-user-rules-selftest.py.
      run: python3 -m unittest discover -s docker/shared/test/compile-user-rules -p "test_*.py"

  # ---------------------------------------------------------------------------
  # Swift. swiftlint --strict, the same gate apple.yml runs on its macOS leg.
  # SwiftLint parses the sources directly, so no xcodegen/project generation is
  # needed here. macOS runner because that is where swiftlint is available.
  # ---------------------------------------------------------------------------
  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: install-swiftlint
      # The macos-15 image may preinstall swiftlint; only install when missing
      # so the step stays quiet (and doesn't emit a brew "already installed"
      # annotation). Same pattern as apple.yml.
      run: brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
    - name: swiftlint
      working-directory: apple
      run: swiftlint lint --strict --quiet

  # ---------------------------------------------------------------------------
  # React. eslint over react/admin (flat config in react/admin/eslint.config.js).
  # New for the PR gate: the app.yml react deploy job only builds, never lints.
  # ---------------------------------------------------------------------------
  react:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react/admin
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: setup-node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: react/admin/package-lock.json
    - name: install
      run: npm ci
    - name: eslint
      run: npm run lint

  # ---------------------------------------------------------------------------
  # Rust. `cargo xtask ci` is the single source of truth for the Linux client's
  # gate (fmt --check, clippy -D warnings, kit tests, xtask repo-shape tests,
  # app tests under xvfb — see linux/xtask/src/ci.rs); invoking the subcommand
  # instead of restating its steps in YAML is what keeps this job and the
  # pre-push gate from drifting. ubuntu-latest (24.04) is deliberately the
  # GTK 4.14 / libadwaita 1.4 API floor that the gtk4/libadwaita crate
  # features enforce — newer API must fail to compile here.
  # ---------------------------------------------------------------------------
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: install-system-deps
      # blueprint-compiler and the GTK dev packages are hard build
      # requirements (build.rs compiles resources/*.blp with no .ui fallback);
      # xvfb lets the cabalmail-gtk widget tests run instead of skipping
      # themselves for want of a display.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-4-dev libadwaita-1-dev blueprint-compiler xvfb
    - name: install-toolchain
      # rustup is preinstalled on the runner and reads linux/rust-toolchain.toml
      # (the exact 1.97.1 pin, with clippy + rustfmt), so no third-party
      # toolchain action is needed.
      run: rustup toolchain install
    - name: cache-cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          linux/target
        key: rust-${{ runner.os }}-${{ hashFiles('linux/Cargo.lock', 'linux/rust-toolchain.toml') }}
        restore-keys: |
          rust-${{ runner.os }}-
    - name: xtask-ci
      run: cargo xtask ci

  # ---------------------------------------------------------------------------
  # Kotlin. The Android client's whole quality gate in one gradle invocation:
  # kit + app unit tests, ktlint, and Android Lint (warnings are errors in
  # both modules — see the lint blocks in android/*/build.gradle.kts). This is
  # deliberately the same command android.yml's test job runs on stage/main
  # pushes, so the PR gate and the deploy gate can't drift. Cache key matches
  # android.yml's so the two workflows share warm caches.
  # ---------------------------------------------------------------------------
  kotlin:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: setup-java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
      with:
        distribution: temurin
        java-version: '21'
    - name: cache-gradle
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-
    - name: gradle-gate
      run: ./gradlew :kit:test :app:testDebugUnitTest ktlintCheck lint
