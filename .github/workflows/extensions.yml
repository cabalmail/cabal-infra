# Browser extension CI (docs/1.x/browser-extension-plan.md, Phase 2).
#
# Two always-on jobs: `test` (lint + vitest + type-check + both bundle
# builds on Linux) and `build-safari` (xcodegen + unsigned xcodebuild of the
# Safari host app on macOS). On stage/main pushes, behind the same gate-*
# approval + warn-green-when-secrets-absent pattern as android.yml:
# `upload-chrome` ships a new draft version to the Chrome Web Store listing,
# and `upload-safari` archives the signed macOS host app and uploads it to
# App Store Connect (parked with a warning until the two extension
# provisioning-profile secrets exist; see docs/browser-extension.md, "Publishing to the App Store").

name: Extensions

on:
  push:
    branches: [main, stage, development]
    paths:
      - 'extensions/**'
      - '.github/workflows/extensions.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'extensions/**'
      - '.github/workflows/extensions.yml'
  workflow_dispatch:

concurrency:
  group: extensions-${{ github.ref }}-${{ github.event.pull_request.number || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/package-lock.json
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        # Falls back to the dev placeholder domain on forks where the
        # repository variable is unset; the bundles are still buildable.
        env:
          CABALMAIL_CONTROL_DOMAIN: ${{ vars.TF_VAR_CONTROL_DOMAIN }}
        run: npm run build
      - name: archive-chrome
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chrome-extension
          path: extensions/chrome/dist/
          retention-days: 14

  build-safari:
    runs-on: macos-26
    defaults:
      run:
        working-directory: extensions
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/package-lock.json
      - name: install-xcodegen
        # Same warning-hygiene pattern as apple.yml: only install what the
        # runner image doesn't already carry, and untap the distrusted
        # preinstalled aws/tap first.
        run: |
          brew untap aws/tap >/dev/null 2>&1 || true
          for pkg in xcodegen; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done
      - name: install
        run: npm ci
      - name: generate-project
        # xcodegen's preGenCommand builds the web-extension bundle into
        # CabalmailExtension/Resources first.
        working-directory: extensions/safari
        env:
          CABALMAIL_CONTROL_DOMAIN: ${{ vars.TF_VAR_CONTROL_DOMAIN }}
        run: xcodegen generate
      - name: build-unsigned
        working-directory: extensions/safari
        run: |
          set -o pipefail
          xcodebuild -project Cabalmail.xcodeproj \
            -scheme CabalmailExtensionHost \
            -destination 'platform=macOS' \
            build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  # -----------------------------------------------------------------------
  # Manual approval gate before the Chrome Web Store upload, mirroring the
  # other mainline deploy workflows (android.yml's Play gate, apple.yml,
  # app.yml/infra.yml). Whether the run actually pauses depends on the
  # gate-${env} environment's protection rules: with required reviewers
  # (gate-prod) it waits for an operator; without them (gate-stage,
  # currently) the job passes on its own. Guarded by the same ref check as
  # upload so a workflow_dispatch run on a feature branch (where upload
  # would skip anyway) never waits at a gate.
  # -----------------------------------------------------------------------
  approval:
    # Both validation jobs gate the uploads (android.yml's approval needs
    # test AND build the same way): a red unsigned Safari build must hold
    # the signed upload behind the gate, not run disconnected beside it.
    needs: [test, build-safari]
    if: github.ref_name == 'main' || github.ref_name == 'stage'
    environment: gate-${{ github.ref_name == 'main' && 'prod' || 'stage' }}
    runs-on: ubuntu-latest
    steps:
      - name: approve
        run: echo "Approved"

  # -----------------------------------------------------------------------
  # Store-variant zip -> Chrome Web Store listing, as a DRAFT version (no
  # publish). Publishing — which is what triggers a store review each time —
  # stays a deliberate act in the developer console until the release
  # cadence settles; this deviates from the plan's publish-to-trustedTesters
  # idea on purpose. Warn-green when the CHROME_WEBSTORE_* secrets are
  # absent (android.yml posture) and when the listing is locked by a
  # pending review (uploads then fail with ITEM_NOT_UPDATABLE / an
  # in-review marker — expected around submissions, not an error).
  # -----------------------------------------------------------------------
  upload-chrome:
    name: Upload to Chrome Web Store
    needs: approval
    # The ref check (not an event check) is what keeps a workflow_dispatch
    # run on a feature branch from uploading.
    if: github.ref_name == 'main' || github.ref_name == 'stage'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'stage' }}
    defaults:
      run:
        working-directory: extensions
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      # Secrets are not readable in a job-level `if`, so the gate is a step
      # that every later step keys off.
      - name: check-credentials
        id: creds
        env:
          EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
        run: |
          if [ -z "$EXTENSION_ID" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CHROME_WEBSTORE_* secrets are not configured; skipping the Web Store upload. See docs/browser-extension.md, \"Publishing to the Chrome Web Store\"."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: install
        if: steps.creds.outputs.present == 'true'
        run: npm ci

      - name: build-store-zip
        if: steps.creds.outputs.present == 'true'
        env:
          CABALMAIL_CONTROL_DOMAIN: ${{ vars.TF_VAR_CONTROL_DOMAIN }}
        run: |
          # Store versions must strictly increase per upload; the CHANGELOG
          # version alone would collide on repeat uploads, so suffix the
          # monotonic run number (manifest versions allow four dot-separated
          # integers). run_number is monotonic per workflow name; a rename
          # resets it — if this workflow is ever renamed, add the last
          # pre-rename run number as an offset here instead of renaming back.
          BASE=$(sed -nE '/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/{ s//\1/p; q; }' ../CHANGELOG.md)
          if [ -z "$BASE" ]; then
            echo "::error::Could not parse a version from CHANGELOG.md"
            exit 1
          fi
          export EXTENSION_VERSION="${BASE}.${{ github.run_number }}"
          echo "Store version: $EXTENSION_VERSION" >> "$GITHUB_STEP_SUMMARY"
          EXTENSION_STORE_BUILD=1 npm run build --workspace chrome
          (cd chrome/dist && zip -qr ../chrome.zip .)

      - name: upload
        if: steps.creds.outputs.present == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
        run: |
          set +e
          OUTPUT=$(npx --yes chrome-webstore-upload-cli@3 upload --source chrome/chrome.zip 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            # A listing locked by a pending review is an expected state, not
            # a broken pipeline; the next push after review completes will
            # carry a higher version and go through.
            if echo "$OUTPUT" | grep -qiE 'ITEM_NOT_UPDATABLE|in.?review|pending review'; then
              echo "::warning::Web Store listing is locked by a pending review; upload skipped. It will succeed on the next push after the review completes."
              exit 0
            fi
            exit "$STATUS"
          fi
          echo "Uploaded draft to the Web Store listing." >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # Signed macOS host app -> App Store Connect, mirroring apple.yml's
  # upload-mac leg (manual signing, disposable keychain, verdict-banner
  # altool check). Parks warn-green until the operator mints the two
  # extension provisioning profiles (docs/browser-extension.md,
  # "Publishing to the App Store";
  # scripts/make-mac-profile.py if the portal refuses macOS profiles) and
  # stores them as MAC_EXT_HOST_APP_STORE_PROFILE /
  # MAC_EXT_WEB_APP_STORE_PROFILE. Certs, team ID, and the ASC API key are
  # the same secrets the mail app's uploads already use.
  # -----------------------------------------------------------------------
  upload-safari:
    name: Upload macOS host app to App Store Connect
    needs: approval
    # The ref check (not an event check) is what keeps a workflow_dispatch
    # run on a feature branch from uploading.
    if: github.ref_name == 'main' || github.ref_name == 'stage'
    runs-on: macos-26
    environment: ${{ github.ref_name == 'main' && 'prod' || 'stage' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: check-credentials
        # Skip-not-fail, matching apple.yml's upload legs: the archive
        # cannot succeed without both embedded targets' profiles, so a
        # missing secret parks the leg with a warning rather than painting
        # every stage push red.
        id: check
        env:
          S1: ${{ secrets.APPLE_TEAM_ID }}
          S2: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          S3: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          S4: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          S5: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          S6: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          S7: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          S8: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          S9: ${{ secrets.MAC_EXT_HOST_APP_STORE_PROFILE }}
          S10: ${{ secrets.MAC_EXT_WEB_APP_STORE_PROFILE }}
        run: |
          MISSING=()
          [ -z "$S1" ] && MISSING+=("APPLE_TEAM_ID")
          [ -z "$S2" ] && MISSING+=("APPLE_DISTRIBUTION_CERT_P12")
          [ -z "$S3" ] && MISSING+=("APPLE_DISTRIBUTION_CERT_PASSWORD")
          [ -z "$S4" ] && MISSING+=("APP_STORE_CONNECT_API_KEY_ID")
          [ -z "$S5" ] && MISSING+=("APP_STORE_CONNECT_API_ISSUER_ID")
          [ -z "$S6" ] && MISSING+=("APP_STORE_CONNECT_API_KEY_P8")
          [ -z "$S7" ] && MISSING+=("MAC_INSTALLER_CERT_P12")
          [ -z "$S8" ] && MISSING+=("MAC_INSTALLER_CERT_PASSWORD")
          [ -z "$S9" ] && MISSING+=("MAC_EXT_HOST_APP_STORE_PROFILE")
          [ -z "$S10" ] && MISSING+=("MAC_EXT_WEB_APP_STORE_PROFILE")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::Safari upload secrets missing: ${MISSING[*]}. Skipping upload. See docs/browser-extension.md, \"Publishing to the App Store\"."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: setup-node
        if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      - name: install-tools
        if: steps.check.outputs.enabled == 'true'
        # Same warning-hygiene pattern as apple.yml.
        run: |
          brew untap aws/tap >/dev/null 2>&1 || true
          for pkg in xcodegen xcbeautify; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: install
        if: steps.check.outputs.enabled == 'true'
        working-directory: extensions
        run: npm ci

      - name: generate-project
        if: steps.check.outputs.enabled == 'true'
        working-directory: extensions/safari
        env:
          CABALMAIL_CONTROL_DOMAIN: ${{ vars.TF_VAR_CONTROL_DOMAIN }}
        run: xcodegen generate

      - name: import-signing-certificates
        if: steps.check.outputs.enabled == 'true'
        env:
          APPLE_DIST_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_DIST_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          INSTALLER_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Apple Distribution signs the .app; Mac Installer Distribution
          # signs the outer .pkg. Disposable per-run keychain, same as
          # apple.yml's upload-mac.
          KEYCHAIN_PATH="$RUNNER_TEMP/ext-ci.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          import_cert() {
            local label="$1" b64="$2" password="$3"
            local p12="$RUNNER_TEMP/$label.p12"
            echo "$b64" | base64 --decode > "$p12"
            security import "$p12" -P "$password" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            rm "$p12"
          }
          import_cert apple-distribution "$APPLE_DIST_P12" "$APPLE_DIST_PASSWORD"
          import_cert mac-installer      "$INSTALLER_P12"  "$INSTALLER_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user \
            -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

      - name: install-asc-api-key
        if: steps.check.outputs.enabled == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ! head -c 27 "$KEY_FILE" | grep -q '^-----BEGIN PRIVATE KEY-----$'; then
            echo "::error::APP_STORE_CONNECT_API_KEY_P8 decoded but does not start with the PEM header. Re-encode with 'base64 -i AuthKey_<KEYID>.p8'."
            exit 1
          fi
          # The group-assignment step below talks to the ASC API directly
          # rather than through altool, so it needs the key by path.
          echo "ASC_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: install-host-profile
        if: steps.check.outputs.enabled == 'true'
        uses: ./.github/actions/install-provisioning-profile
        with:
          base64: ${{ secrets.MAC_EXT_HOST_APP_STORE_PROFILE }}
          extension: provisionprofile
          env-name: MAC_EXT_HOST_APP_STORE_PROFILE_UUID

      - name: install-web-extension-profile
        if: steps.check.outputs.enabled == 'true'
        uses: ./.github/actions/install-provisioning-profile
        with:
          base64: ${{ secrets.MAC_EXT_WEB_APP_STORE_PROFILE }}
          extension: provisionprofile
          env-name: MAC_EXT_WEB_APP_STORE_PROFILE_UUID

      - name: archive
        if: steps.check.outputs.enabled == 'true'
        working-directory: extensions/safari
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Same version derivation as the other store legs: CHANGELOG
          # marketing version, clock build number.
          MARKETING_VERSION=$(sed -nE '/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/{ s//\1/p; q; }' "$GITHUB_WORKSPACE/CHANGELOG.md")
          if [ -z "$MARKETING_VERSION" ]; then
            echo "::error::Could not parse a marketing version from CHANGELOG.md"
            exit 1
          fi
          BUILD_NUMBER="$(date -u +%s)"
          echo "Version: $MARKETING_VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          # The group-assignment step looks the build up by CFBundleVersion.
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project Cabalmail.xcodeproj \
            -scheme CabalmailExtensionHost \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/CabalmailExtension.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MAC_EXT_HOST_APP_STORE_PROFILE_UUID="$MAC_EXT_HOST_APP_STORE_PROFILE_UUID" \
            MAC_EXT_WEB_APP_STORE_PROFILE_UUID="$MAC_EXT_WEB_APP_STORE_PROFILE_UUID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | xcbeautify --renderer github-actions

      - name: export-pkg
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -o pipefail
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$PLIST" <<PLISTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>installerSigningCertificate</key>
              <string>3rd Party Mac Developer Installer</string>
              <key>destination</key>
              <string>export</string>
              <key>uploadSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.cabalmail.extension-host</key>
                  <string>$MAC_EXT_HOST_APP_STORE_PROFILE_UUID</string>
                  <key>com.cabalmail.extension-host.web-extension</key>
                  <string>$MAC_EXT_WEB_APP_STORE_PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          PLISTEOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CabalmailExtension.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$PLIST" \
            2>&1 | xcbeautify --renderer github-actions

      - name: upload
        if: steps.check.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          PKG=$(ls "$RUNNER_TEMP/export"/*.pkg | head -n1)
          echo "Uploading $PKG"
          LOG="$RUNNER_TEMP/altool.log"
          xcrun altool --upload-app \
            -f "$PKG" \
            --type osx \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$LOG"
          # altool's exit code and ERROR lines are both unreliable; trust
          # the final verdict banner (same rationale as apple.yml).
          if grep -qE '(UPLOAD FAILED|iris-code : STATE_ERROR)' "$LOG" \
             || ! grep -q 'UPLOAD SUCCEEDED' "$LOG"; then
            echo "::error::altool did not report a clean UPLOAD SUCCEEDED. Review the log above."
            exit 1
          fi
          if grep -q 'ERROR: ' "$LOG"; then
            echo "::warning::altool logged transient error(s) but recovered - final verdict was UPLOAD SUCCEEDED."
          fi
          echo "::notice::altool upload completed cleanly."

      - name: Assign build to TestFlight group
        # Route builds to the internal group matching the branch, exactly as
        # apple.yml does for the mail apps: the control domain is baked into
        # an extension build (there is no per-install domain entry as on
        # Apple and Android), so a stage build and a prod build are
        # genuinely different products and must not reach the same testers.
        # NOT best-effort: a build that cannot be attached never reaches
        # anyone, so the failure has to be visible. Requires internal groups
        # named exactly `stage` and `prod` on the extension-host app record,
        # with automatic distribution OFF -- see docs/browser-extension.md.
        if: steps.check.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BUNDLE_ID: com.cabalmail.extension-host
          TF_GROUP: ${{ github.ref_name == 'main' && 'prod' || 'stage' }}
        run: |
          set -euo pipefail
          # Isolated venv: the runner's Homebrew python is externally
          # managed (PEP 668), so a bare `pip install` is refused.
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography
          "$RUNNER_TEMP/ascvenv/bin/python" "$GITHUB_WORKSPACE/.github/scripts/assign-testflight-group.py"
