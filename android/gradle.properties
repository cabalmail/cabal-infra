# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Cache task outputs between builds (also speeds up CI with actions/cache).
org.gradle.caching=true
# AndroidX is the only supported artifact family.
android.useAndroidX=true
# Namespaced R classes: modules see only their own resources.
android.nonTransitiveRClass=true
kotlin.code.style=official
