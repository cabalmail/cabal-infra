# XcodeGen project spec for the Safari Web Extension host
# (docs/1.x/browser-extension-plan.md, Phase 8.2).
#
# Run `xcodegen generate` in this directory to produce Cabalmail.xcodeproj.
# The generated project is not committed; CI regenerates it before every
# build. The web-extension bundle (CabalmailExtension/Resources) is build
# output too -- the preGenCommand materializes it from the shared
# TypeScript build, mirroring apple/project.yml's vendored-assets pattern.
#
# macOS host only for now; the iOS/visionOS host app is Phase 8.3.

name: Cabalmail

options:
  preGenCommand: cd .. && npm run build --workspace safari
  bundleIdPrefix: com.cabalmail
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    # DEVELOPMENT_TEAM is intentionally unset here; CI passes it on the
    # xcodebuild command line, unsigned verification passes
    # CODE_SIGNING_ALLOWED=NO (same convention as apple/project.yml).
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Store versioning: CI overrides both on the xcodebuild command line
    # (marketing version from CHANGELOG, build number from the clock, same
    # derivation as apple.yml); the defaults keep local builds working.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  CabalmailExtensionHost:
    type: application
    platform: macOS
    sources:
      - path: Cabalmail
    dependencies:
      - target: CabalmailExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: "Cabalmail Extension"
        PRODUCT_BUNDLE_IDENTIFIER: com.cabalmail.extension-host
        # Cabalmail/AppIcon.icon, generated by scripts/generate-logo-assets
        # like the mail apps'. actool emits the legacy .icns fallback from
        # it, which is what App Store validation demands (error 90236: no
        # ICNS with a 512pt@2x image).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Cabalmail/CabalmailExtensionHost.entitlements
      configs:
        # Manual signing for Release only, mirroring apple/project.yml: the
        # settings live here rather than on the xcodebuild command line so
        # the embedded extension target keeps its own profile. CI injects
        # MAC_EXT_HOST_APP_STORE_PROFILE_UUID as a user-defined setting;
        # Debug stays on the project-level Automatic style.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(MAC_EXT_HOST_APP_STORE_PROFILE_UUID)"
    info:
      path: Cabalmail/Info.plist
      properties:
        CFBundleDisplayName: Cabalmail Extension
        # Required by App Store validation for asset-catalog icons, same as
        # the targets in apple/project.yml.
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity

  CabalmailExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: CabalmailExtension/SafariWebExtensionHandler.swift
      # A group, NOT `type: folder`: a folder reference copies the directory
      # itself into the appex, putting the bundle at
      # Contents/Resources/Resources/ -- one level below where Safari and App
      # Store validation both look for manifest.json (error 90850). A group's
      # files are enumerated at generate time, which is safe here because the
      # preGenCommand builds the bundle before xcodegen runs.
      - path: CabalmailExtension/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cabalmail.extension-host.web-extension
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: CabalmailExtension/CabalmailExtension.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(MAC_EXT_WEB_APP_STORE_PROFILE_UUID)"
    info:
      path: CabalmailExtension/Info.plist
      properties:
        CFBundleDisplayName: Cabalmail
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
