# XcodeGen project spec for the Cabalmail Apple client.
#
# Run `xcodegen generate` in this directory to produce Cabalmail.xcodeproj.
# The generated project is not committed; CI regenerates it before every build.
#
# Phase 1 decision: native macOS target (not Mac Catalyst). See docs/apple.md.

name: Cabalmail

# Shared build settings live in Base.xcconfig, which optionally includes
# Local.xcconfig (gitignored) for per-developer overrides such as
# DEVELOPMENT_TEAM. CI passes DEVELOPMENT_TEAM on the xcodebuild command
# line instead and does not need Local.xcconfig to exist.
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig

options:
  # Materialize the gitignored marked + turndown bundles before generating.
  # A project generated without them still builds, but the app's rich-text
  # bridge throws on load and never reports ready, which used to leave the
  # compose From picker permanently empty (#734). CI also runs the script
  # explicitly; here it covers local and agent-driven builds, where the
  # generate step is the one universal entry point. Needs node/npm on the
  # first run (the script skips `npm ci` once the sources are present).
  preGenCommand: scripts/sync-vendored.sh
  bundleIdPrefix: com.cabalmail
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    visionOS: "2.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  CabalmailKit:
    path: CabalmailKit

settings:
  base:
    SWIFT_VERSION: "5.10"
    # DEVELOPMENT_TEAM is intentionally unset here. Set it via:
    #   - Xcode UI (Signing & Capabilities) for local development, or
    #   - `xcodebuild ... DEVELOPMENT_TEAM=$APPLE_TEAM_ID` on CI (from secrets).
    # Unsigned build-only verification passes `CODE_SIGNING_ALLOWED=NO`.
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Cabalmail:
    type: application
    supportedDestinations: [iOS, iPadOS, visionOS]
    sources:
      - path: Cabalmail
    dependencies:
      - package: CabalmailKit
      # Embed the watch companion app in the iOS product only. A visionOS
      # archive of this same target cannot contain a watch app (watches
      # pair with iPhones), so the dependency is destination-filtered —
      # without this, the visionOS TestFlight leg would fail validation.
      - target: CabalmailWatch
        destinationFilters: [iOS]
      # Notification Service Extension: enriches the wake-signal push
      # ("New mail") with sender / subject / snippet on-device, so message
      # content never transits APNs (see docs/0.11.x/push-notifications.md).
      # iOS-only for now, same destination-filter rationale as the watch —
      # the push feature ships on iOS first and a visionOS archive must not
      # embed an extension its provisioning doesn't cover.
      - target: CabalmailNotificationService
        destinationFilters: [iOS]
    info:
      path: Cabalmail/Info.plist
      properties:
        CFBundleDisplayName: Cabalmail
        # Required by App Store validation for apps built against
        # iOS 11+ SDKs that ship icons in an asset catalog. Routed through
        # the build setting so it tracks the per-SDK override below —
        # `AppIcon` on iOS/iPadOS, `AppIconVision` on visionOS. A literal
        # `AppIcon` here points visionOS at an icon that isn't in its
        # compiled catalog (actool compiles only the xros primary icon),
        # so the device falls back to a flat squircle in the icon well.
        CFBundleIconName: "$(ASSETCATALOG_COMPILER_APPICON_NAME)"
        # App uses only standard HTTPS/TLS; exempt from export compliance
        # questions on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # iPadOS opens compose as a real scene rather than a sheet; that
        # only works when the app advertises multi-scene support. The
        # `UIApplicationSupportsMultipleScenes` key MUST be nested inside
        # `UIApplicationSceneManifest` — iOS silently ignores it at the
        # top level, which makes every `openWindow(...)` call a no-op
        # and the New Message / Reply buttons appear dead. iPhone
        # ignores the flag (it can't multitask scenes anyway) and the
        # compose-launch helper falls back to the sheet path there.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Register Cabalmail as a candidate handler for `mailto:` links.
        # iOS surfaces this in Settings -> Apps -> Mail -> Default Mail
        # App on iOS 14+; users must opt in there for `mailto:` clicks
        # in Safari / other apps to route here. Role Editor matches what
        # mail clients use — we both compose and send.
        CFBundleURLTypes:
          - CFBundleURLName: com.cabalmail.mailto
            CFBundleURLSchemes: [mailto]
            CFBundleTypeRole: Editor
        # Cabalmail reads the system address book locally to suggest
        # recipient names while composing and to show contact photos
        # next to incoming mail. Contact data is never sent to a
        # server; the only addresses that leave the device are the
        # ones the user explicitly types into To/Cc/Bcc.
        NSContactsUsageDescription: >-
          Cabalmail uses your contacts on this device to suggest
          recipients while you compose, to show your saved photo
          and name next to mail you receive, and to add senders to
          your contacts when you choose. Your contacts stay on
          this device.
        # Expands at build time to "<TEAMID>." — read at runtime by
        # `PushEnrichmentStore` to compose the fully-qualified shared
        # keychain access group (`<TEAMID>.com.cabalmail.shared`), which
        # SecItem requires verbatim (the entitlement's
        # `$(AppIdentifierPrefix)` shorthand is signing-time only). Unsigned
        # builds expand it to the empty string; the resulting SecItem
        # failure is tolerated (push enrichment is best-effort).
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        # Route the plist's version fields through build settings so CI's
        # `CURRENT_PROJECT_VERSION=<timestamp>` actually reaches the shipped
        # Info.plist. Without this, XcodeGen hardcodes "1" / "1.0" and
        # every archive uploads as CFBundleVersion=1.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Plain system-background launch screen. This used to point at
        # AccentColor, which was harmless while that colorset was empty;
        # now that the accent is the forest brand color, keeping the
        # reference would flash a solid green screen on every launch.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # App-private drag type for dragging messages onto sidebar folders
        # (see Cabalmail/Views/MessageDrag.swift). Declaring it as an
        # exported type lets Launch Services recognize the identifier so the
        # runtime doesn't warn; `.ownProcess` visibility on the item provider
        # keeps the drag from ever leaving the app, so it only needs to
        # conform to public.data.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cabalmail.message-move
            UTTypeDescription: Cabalmail message reference
            UTTypeConformsTo:
              - public.data
        # Continued from a tapped Spotlight result (the literal value of
        # CSSearchableItemActionType). Declaring it lets the system hand the
        # activity to `.onContinueUserActivity` in CabalmailApp.swift.
        NSUserActivityTypes:
          - com.apple.corespotlightitem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cabalmail.Cabalmail
        TARGETED_DEVICE_FAMILY: "1,2,7"   # iPhone, iPad, visionOS
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iOS / iPadOS use the Liquid Glass AppIcon.icon (Icon Composer bundle
        # at Cabalmail/AppIcon.icon); visionOS uses the layered
        # AppIconVision.solidimagestack (back/middle/front, composited with
        # parallax on gaze focus) in Cabalmail/Assets.xcassets. Both are
        # regenerated by scripts/generate-logo-assets from
        # vector/cabalmail-logo.svg. The name "AppIcon" resolves to whichever
        # actool finds for the SDK; the xros override below picks the stack.
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xros*]": AppIconVision
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xrsimulator*]": AppIconVision
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The entitlements file ships empty by default — the only iOS
        # entitlement Cabalmail has ever needed is the Apple-managed
        # `com.apple.developer.mail-client`, which a fork enables by
        # adding the key once Apple has approved the request. See the
        # file's own comment, and the "Setting Cabalmail as the
        # default mail handler" section of `docs/apple.md`, for the
        # rollout. Wiring this empty file from day one means a fork
        # only edits the entitlements file, not `project.yml`, when
        # approval lands.
        CODE_SIGN_ENTITLEMENTS: Cabalmail/Cabalmail.entitlements
      configs:
        # Manual-signing settings live ON THE APP TARGET ONLY, not in the
        # xcodebuild command line. CabalmailKit ships resources, which
        # makes Xcode auto-generate a `CabalmailKit_CabalmailKit` resource
        # bundle target during the SPM integration step. A top-level
        # `PROVISIONING_PROFILE_SPECIFIER=...` on the xcodebuild command
        # line propagates to that resource bundle and the archive fails
        # ("resource bundles do not support provisioning profiles"). Per-
        # target settings here are only seen by Cabalmail, not by the
        # synthetic SPM resource bundle.
        #
        # Local dev still works: Debug uses Automatic signing inherited
        # from the project-level `CODE_SIGN_STYLE: Automatic`. Release is
        # the archive path and expects `IOS_APP_STORE_PROFILE_UUID` to be
        # injected by CI as a user-defined setting (apple.yml passes it
        # via `xcodebuild ... IOS_APP_STORE_PROFILE_UUID=$UUID`).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(IOS_APP_STORE_PROFILE_UUID)"

  CabalmailMac:
    type: application
    platform: macOS
    sources:
      - path: CabalmailMac
      # Phase 4 share: the SwiftUI views, view models, and app state are
      # platform-agnostic (with `#if os(macOS)` toggles where they diverge)
      # so both app targets compile them from the iOS target's source tree.
      # Per Phase 1 the binaries stay separate; only the Swift sources are
      # shared. Revisit at Phase 7 if macOS needs substantially different
      # view code.
      - path: Cabalmail/ContentView.swift
      - path: Cabalmail/AppState.swift
      - path: Cabalmail/AppStateSignals.swift
      - path: Cabalmail/NavStateCoordinator.swift
      # Spotlight tap routing (shared AppState extension; both app entries
      # attach the .onContinueUserActivity handler that calls into it).
      - path: Cabalmail/SpotlightRouting.swift
      - path: Cabalmail/PreferencesSyncCoordinator.swift
      - path: Cabalmail/Pasteboard.swift
      # Shared with AppState.swift: the no-op stub branch compiles here
      # (WatchConnectivity is iOS-only). See WatchSessionBridge.swift.
      - path: Cabalmail/WatchSessionBridge.swift
      # Push notifications (phase 6, macOS parity): one implementation for
      # both platforms — each file carries an `#if os(iOS)` / `#else`
      # (AppKit) branch around the small platform seams.
      - path: Cabalmail/AppDelegate.swift
      - path: Cabalmail/PushRegistrar.swift
      - path: Cabalmail/Views
      - path: Cabalmail/ViewModels
    dependencies:
      - package: CabalmailKit
      # Notification Service Extension, macOS flavor: same enrichment
      # source as the iOS target's extension, compiled into a separate
      # macOS appex (see the CabalmailMacNotificationService target).
      - target: CabalmailMacNotificationService
    info:
      path: CabalmailMac/Info.plist
      properties:
        # App Store Connect requires a unique app name per record, so the
        # macOS app is registered there as "Cabalmail Mac". CFBundleName
        # drives the macOS app menu (the bold entry next to the Apple
        # menu), so we override it back to "Cabalmail" — the TestFlight
        # listing keeps the unique name while the running app looks like
        # a normal "Cabalmail" alongside its iOS sibling.
        CFBundleName: Cabalmail
        CFBundleDisplayName: Cabalmail
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        # Register Cabalmail as a candidate handler for `mailto:` links.
        # macOS surfaces this in System Settings -> Desktop & Dock ->
        # Default web browser / Default mail reader; users must opt in
        # there for `mailto:` clicks across the system to route here.
        # Role Editor matches what mail clients use — we both compose
        # and send.
        CFBundleURLTypes:
          - CFBundleURLName: com.cabalmail.mailto
            CFBundleURLSchemes: [mailto]
            CFBundleTypeRole: Editor
        # Mirror of the iOS string. macOS additionally requires the
        # `com.apple.security.personal-information.addressbook`
        # entitlement (see CabalmailMac.entitlements) because the app
        # runs sandboxed; the usage description alone is not enough.
        NSContactsUsageDescription: >-
          Cabalmail uses your contacts on this device to suggest
          recipients while you compose, to show your saved photo
          and name next to mail you receive, and to add senders to
          your contacts when you choose. Your contacts stay on
          this device.
        # See the Cabalmail target's equivalent comment: read at runtime by
        # `PushEnrichmentStore` to compose the fully-qualified shared
        # keychain access group. Without it the mac app never mirrors the
        # ID token and every notification stays "New mail".
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        # See the Cabalmail target's equivalent comment — XcodeGen defaults
        # these to "1" / "1.0" unless explicitly plumbed through to the
        # build settings.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Mirror of the iOS target's app-private message-move drag type. See
        # the Cabalmail target's matching block.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cabalmail.message-move
            UTTypeDescription: Cabalmail message reference
            UTTypeConformsTo:
              - public.data
        # Mirror of the iOS target's Spotlight-continuation declaration; the
        # handler lives in CabalmailMacApp.swift.
        NSUserActivityTypes:
          - com.apple.corespotlightitem
        # macOS-only: without this key Spotlight never routes a donated
        # item back to the donating app — it falls back to opening the
        # result by content type, and `public.email-message`'s default
        # handler is Apple Mail. iOS has no equivalent requirement.
        CoreSpotlightContinuation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cabalmail.CabalmailMac
        # On-disk .app filename. Defaults to the target name
        # ("CabalmailMac"); overriding to "Cabalmail" ships the bundle as
        # Cabalmail.app. The iOS and macOS apps never coexist on the same
        # device (different platforms), so the filename collision risk is
        # theoretical.
        PRODUCT_NAME: Cabalmail
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: CabalmailMac/CabalmailMac.entitlements
      configs:
        # See the Cabalmail target's matching block for why these settings
        # live here instead of on the xcodebuild command line. CI injects
        # MAC_APP_STORE_PROFILE_UUID as a user-defined setting.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(MAC_APP_STORE_PROFILE_UUID)"

  # Watch companion app, scoped to the address lifecycle (create / list /
  # revoke) — mail reading stays on the other platforms. Deliberately NOT
  # embedded in the iOS app yet: embedding adds the watch app to the iOS
  # archive's signing inputs (every App Store upload would need the watch
  # provisioning profile), so that lands with the watch signing/TestFlight
  # work. Until then the target builds and runs in the simulator via its
  # own scheme and CI leg.
  CabalmailWatch:
    type: application
    platform: watchOS
    sources:
      - path: CabalmailWatch
    dependencies:
      - package: CabalmailKit
    info:
      path: CabalmailWatch/Info.plist
      properties:
        CFBundleDisplayName: Cabalmail
        # Required by App Store validation for asset-catalog icons, same
        # as the other targets.
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        # Single-target watchOS app (SwiftUI app lifecycle, no WatchKit
        # extension bundle). Required for the watchOS 7+ app structure.
        WKApplication: true
        # Pairs the watch app with the iOS companion. The credential
        # bootstrap (Configuration + Cognito refresh token) arrives from
        # the phone over WatchConnectivity — the two devices do not share
        # a keychain, so the watch cannot read the phone's tokens.
        WKCompanionAppBundleIdentifier: com.cabalmail.Cabalmail
        # See the Cabalmail target's equivalent comment — XcodeGen defaults
        # these to "1" / "1.0" unless explicitly plumbed through to the
        # build settings.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        # Apple's convention for a watch app paired to an iOS companion:
        # the companion's bundle id plus a `.watchkitapp` suffix.
        PRODUCT_BUNDLE_IDENTIFIER: com.cabalmail.Cabalmail.watchkitapp
        # On-watch app name; defaults to the target name otherwise.
        PRODUCT_NAME: Cabalmail
        # App Store validation requires a watch app's version to match its
        # iOS companion exactly — keep both fields in lockstep with the
        # Cabalmail target above.
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The single 1024pt universal watch icon is regenerated by
        # scripts/generate-logo-assets from vector/cabalmail-logo.svg,
        # like every other icon catalog.
        CODE_SIGN_ENTITLEMENTS: CabalmailWatch/CabalmailWatch.entitlements
      configs:
        # See the Cabalmail target's matching block for why manual-signing
        # settings live per-target instead of on the xcodebuild command
        # line. CI injects WATCHOS_APP_STORE_PROFILE_UUID as a user-defined
        # setting when archiving the iOS app (which embeds this target).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCHOS_APP_STORE_PROFILE_UUID)"

  # Notification Service Extension for the iOS app. Wakes on every
  # `mutable-content: 1` push, calls `/push_envelope` with the Cognito ID
  # token the main app mirrors into the shared keychain group, and rewrites
  # the bare "New mail" alert into sender / subject / snippet. Deliberately
  # tiny: Foundation + UserNotifications only, no CabalmailKit — the values
  # it needs arrive via the App Group container and the shared keychain
  # (see docs/0.11.x/push-notifications.md and PushEnrichmentStore).
  CabalmailNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: CabalmailNotificationService
    info:
      path: CabalmailNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Cabalmail Notification Service
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
        # Runtime team-prefix for the explicit-group keychain read (macOS
        # resolves group-less data-protection-keychain searches differently
        # from iOS; see PushHandoff.currentIdToken). Same expansion
        # caveat as the app targets: empty in unsigned builds.
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        # See the Cabalmail target's equivalent comment — XcodeGen defaults
        # these to "1" / "1.0" unless explicitly plumbed through to the
        # build settings. App Store validation additionally requires an
        # extension's versions to match its host app exactly; CI passes both
        # on the xcodebuild command line, reaching every target at once.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        # Apple's convention for app extensions: the host app's bundle id
        # plus a suffix. The push-dispatch Lambda targets the *host* topic;
        # this id only matters for embedding and provisioning.
        PRODUCT_BUNDLE_IDENTIFIER: com.cabalmail.Cabalmail.NotificationService
        # Keep in lockstep with the Cabalmail target above (host/extension
        # version match is enforced at App Store validation).
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        # App Group (shared UserDefaults for api_url) + shared keychain
        # access group (Cognito ID token). Mirrors the host app's additions
        # in Cabalmail/Cabalmail.entitlements.
        CODE_SIGN_ENTITLEMENTS: CabalmailNotificationService/CabalmailNotificationService.entitlements
      configs:
        # See the Cabalmail target's matching block for why manual-signing
        # settings live per-target instead of on the xcodebuild command
        # line. CI injects IOS_NSE_APP_STORE_PROFILE_UUID as a user-defined
        # setting when archiving the iOS app (which embeds this target).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(IOS_NSE_APP_STORE_PROFILE_UUID)"

  # macOS twin of CabalmailNotificationService (push phase 6). Compiles the
  # SAME Swift source — the NSE is Foundation + UserNotifications + Security
  # only, with nothing platform-conditional in it — into a separate macOS
  # appex product with its own bundle id, Info.plist, and entitlements
  # (sandboxed mac processes need explicit network.client; see the
  # entitlements file). Embedded in CabalmailMac, never in the iOS/visionOS
  # app.
  CabalmailMacNotificationService:
    type: app-extension
    platform: macOS
    sources:
      - path: CabalmailNotificationService/NotificationService.swift
    info:
      path: CabalmailMacNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Cabalmail Notification Service
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
        # Runtime team-prefix for the explicit-group keychain read (macOS
        # resolves group-less data-protection-keychain searches differently
        # from iOS; see PushHandoff.currentIdToken). Same expansion
        # caveat as the app targets: empty in unsigned builds.
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        # See the Cabalmail target's equivalent comment — XcodeGen defaults
        # these to "1" / "1.0" unless explicitly plumbed through to the
        # build settings. App Store validation additionally requires an
        # extension's versions to match its host app exactly; CI passes both
        # on the xcodebuild command line, reaching every target at once.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        # Apple's convention for app extensions: the host app's bundle id
        # plus a suffix. The push-dispatch Lambda targets the *host* topic
        # (com.cabalmail.CabalmailMac, already in push_register's
        # allowlist); this id only matters for embedding and provisioning.
        PRODUCT_BUNDLE_IDENTIFIER: com.cabalmail.CabalmailMac.NotificationService
        # Keep in lockstep with the CabalmailMac target above (host/extension
        # version match is enforced at App Store validation).
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        # Same requirement as the host app: hardened runtime is mandatory
        # for notarized / App Store macOS code, extensions included.
        ENABLE_HARDENED_RUNTIME: YES
        # App Group (shared UserDefaults for api_url), shared keychain
        # access group (Cognito ID token), sandbox + outbound network.
        # Mirrors the host app's additions in CabalmailMac.entitlements.
        CODE_SIGN_ENTITLEMENTS: CabalmailMacNotificationService/CabalmailMacNotificationService.entitlements
      configs:
        # See the Cabalmail target's matching block for why manual-signing
        # settings live per-target instead of on the xcodebuild command
        # line. CI injects MAC_NSE_APP_STORE_PROFILE_UUID as a user-defined
        # setting when archiving the mac app (which embeds this target).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(MAC_NSE_APP_STORE_PROFILE_UUID)"

  # Unit tests for the shared app layer (view models, app state). Hosted
  # by CabalmailMac rather than the iOS app deliberately: the mac target
  # already compiles the exact same shared sources (see its source list
  # above), and a macOS test bundle runs natively on the CI mac runner —
  # no simulator boot. The suite lives in CabalmailTests/ (no "Mac" in
  # the directory name) because nothing in it is platform-specific; only
  # the host choice is.
  CabalmailMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CabalmailTests
    dependencies:
      - target: CabalmailMac
      - package: CabalmailKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cabalmail.CabalmailMacTests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives TEST_HOST from the host target's NAME, but
        # CabalmailMac overrides PRODUCT_NAME to "Cabalmail" (the bundle
        # ships as Cabalmail.app), so spell the path out.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cabalmail.app/Contents/MacOS/Cabalmail"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Cabalmail:
    build:
      targets:
        Cabalmail: all
    run:
      config: Debug
    archive:
      config: Release
  CabalmailMac:
    build:
      targets:
        CabalmailMac: all
        CabalmailMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CabalmailMacTests
    archive:
      config: Release
