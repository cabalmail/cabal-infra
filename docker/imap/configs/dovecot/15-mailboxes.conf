namespace inbox {
  inbox = yes
  mailbox INBOX {
    # Dovecot does not auto-subscribe INBOX by default, and mailbox
    # provisioning never seeds `.subscriptions` — so a fresh account (and
    # any existing one whose subscription list never included INBOX) shows
    # up unsubscribed, which the clients render as the "unsubscribed
    # folder is not kept up-to-date" banner over the inbox itself.
    # Pinning `auto = subscribe` here subscribes both new and existing
    # mailboxes on next access, matching the pattern used for Archive.
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Trash {
    special_use = \Trash
    # Auto-create (not subscribe, matching the historical Lambda behavior) so
    # a fresh mailbox has Trash before its first delete. /move_messages used
    # to force-create it on every delete to cover the gap; this moves that
    # responsibility to Dovecot so the Lambda can stop paying the round trip.
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Archive {
    special_use = \Archive
    # Subscribe (not just create) so existing clients discover it: the
    # notification "Archive" action targets this folder and needs it to
    # exist for every mailbox, old and new, without a Lambda-side
    # create-on-demand round trip (docs/0.11.x/push-notifications.md).
    auto = subscribe
  }
}
