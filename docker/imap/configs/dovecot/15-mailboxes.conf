namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Trash {
    special_use = \Trash
    # Auto-create (not subscribe, matching the historical Lambda behavior) so
    # a fresh mailbox has Trash before its first delete. /move_messages used
    # to force-create it on every delete to cover the gap; this moves that
    # responsibility to Dovecot so the Lambda can stop paying the round trip.
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Archive {
    special_use = \Archive
    # Subscribe (not just create) so existing clients discover it: the
    # notification "Archive" action targets this folder and needs it to
    # exist for every mailbox, old and new, without a Lambda-side
    # create-on-demand round trip (docs/0.11.0/push-notifications.md).
    auto = subscribe
  }
}
