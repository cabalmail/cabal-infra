# Phase 4 (docs/0.10.x/container-runtime-hardening-plan.md): reject plaintext
# auth unless the session is secured. Every session reaching 143 must now
# upgrade with STARTTLS first - the entrypoint also sets ssl = required and
# narrows login_trusted_networks (05-login.conf) to loopback, because the
# NLB listener whose forwarded plain traffic needed trusting is gone
# (#778/#779). auth_failure_delay slows credential stuffing.
disable_plaintext_auth = yes
auth_failure_delay = 2 secs
auth_realms = smtpauth
auth_master_user_separator = *
auth_mechanisms = plain
userdb {
    driver = passwd
	args = blocking=no
}
!include auth-system.conf.ext
!include auth-master.conf.ext
