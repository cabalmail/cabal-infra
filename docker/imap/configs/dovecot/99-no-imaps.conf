# Close the implicit-TLS IMAPS listener that dovecot's stock 10-master.conf
# opens on 993. Nothing uses it and nothing can reach it: the NLB listener
# that fronted it was removed (#778/#779), and the task ENI's security group
# (cabal-ecs-imap-sg) admits only 25/tcp and 143/tcp from the VPC CIDR, and
# the task definition no longer maps the port. (Two VPC groups -
# cabal-ecs-instance-sg and cabal-nat-instance-sg - do allow all protocols
# from the VPC CIDR, but the tasks are awsvpc, so the task ENI's group is the
# one that governs.) Every consumer dials 143 and issues STARTTLS.
#
# Numbered 99 so it is read after 10-master.conf and its port setting wins;
# overwriting 10-master.conf itself would take the rest of dovecot's service
# definitions with it.
service imap-login {
  inet_listener imaps {
    port = 0
  }
}
