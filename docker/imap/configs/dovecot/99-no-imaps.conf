# Close the implicit-TLS IMAPS listener that dovecot's stock 10-master.conf
# opens on 993. Nothing uses it and nothing can reach it: the NLB listener
# that fronted it was removed (#778/#779), and the task ENI's security group
# (cabal-ecs-imap-sg) admits only 25/tcp and 143/tcp from the VPC CIDR - no
# security group in the VPC admits 993 at all. Every consumer dials 143 and
# issues STARTTLS.
#
# Numbered 99 so it is read after 10-master.conf and its port setting wins;
# overwriting 10-master.conf itself would take the rest of dovecot's service
# definitions with it.
service imap-login {
  inet_listener imaps {
    port = 0
  }
}
