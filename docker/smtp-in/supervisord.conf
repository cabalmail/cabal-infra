[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autorestart=true
priority=1

[program:log-tailer]
command=tail -F /var/log/maillog
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
priority=2
startsecs=0

[program:hosts-pin]
command=/usr/local/bin/hosts-pin.sh daemon
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
startsecs=0
priority=5

[program:sendmail]
command=/usr/local/bin/sendmail-wrapper.sh
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
startsecs=5
# Persistent shared relay queue is on EFS (the smtp-out queue-persistence
# pattern, docs/0.9.x/smtp-out-queue-persistence-plan.md, applied to this
# tier). The 110s grace lets an in-flight relay delivery finish before
# SIGKILL; combined with the ECS task stopTimeout=120 set in the smtp_in
# task definition, the queue's cross-task handoff becomes the safety net
# rather than the primary mechanism for surviving deploys.
stopwaitsecs=110
priority=10

# Inbound-auth verification milters, observe-only (phase 1 of
# docs/0.10.x/inbound-auth-verification-plan.md). Start order relative
# to sendmail is not load-bearing: sendmail's F=T milter flag tempfails
# inbound mail while a socket is down, so autorestart here plus sender
# retries cover any gap.
[program:opendkim]
command=/usr/sbin/opendkim -f -x /etc/opendkim.conf
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
priority=20

[program:opendmarc]
command=/usr/sbin/opendmarc -f -c /etc/opendmarc.conf
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
priority=21

[program:reconfigure]
command=/usr/local/bin/reconfigure.sh
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
priority=30
stopwaitsecs=30
