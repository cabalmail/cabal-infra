# Licence and advisory policy for the Linux client's dependency graph.
#
# Run by `cargo xtask ci --step supply-chain`, which is what the `supply-chain`
# job in .github/workflows/linux.yml runs. The failures this exists to catch are
# the ones a reviewer cannot see in a diff: a transitive dependency that picks
# up a reciprocal licence, a crate with a published advisory, or a source that
# is not crates.io.

[graph]
# The client is packaged for Arch, Debian/Ubuntu, and Fedora/RHEL, all glibc
# Linux. Narrowing the graph to the targets that are actually built keeps
# Windows and WASI shims out of the licence report, where they would be noise a
# reader has to learn to skip.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
# Both of these are stated rather than left to their defaults, which are
# looser: `yanked` warns, and `unmaintained` reports only the crates the
# workspace names itself. Nearly every crate here is transitive, so the default
# would have this job stay green through exactly the reports it was added to
# surface.
yanked = "deny"
unmaintained = "all"
# There is no ignore list, and this is the place to put one: an advisory id and
# a sentence saying why it does not reach us — never a bare id.
ignore = []

[licenses]
# The client is AGPL-3.0-or-later, so a permissive dependency is always
# compatible and a reciprocal one usually is not. Adding to this list is a
# licensing decision, which is why it fails in CI and gets argued in a PR
# rather than being resolved by whoever hit it first.
allow = [
  # The workspace's own crates.
  "AGPL-3.0-or-later",
  # Permissive, and between them the licence of nearly every crate in the graph.
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unlicense",
  # The Unicode data tables, via unicode-ident.
  "Unicode-3.0",
  # File-level copyleft: it reaches the files of the crate itself and no
  # further, so linking one into an AGPL binary is not a licensing problem.
  # option-ext, under directories, is the only one today.
  "MPL-2.0",
]
# How sure the licence text has to look before a match is accepted; above
# cargo-deny's default of 0.8, so a file that only resembles a known licence is
# reported as unmatched rather than resolved to a guess.
confidence-threshold = 0.93

[bans]
# Two versions of one crate is a fact of a large graph, not a defect. It is
# worth seeing in the log and not worth failing a push over.
multiple-versions = "warn"
# A `*` version accepts whatever is published next, including a rewrite. The
# packaged build resolves offline against a committed lock, so this would not
# ship a surprise — it would make the lock the only record of what was chosen.
wildcards = "deny"
# A path dependency has no version to pin and reads as a wildcard. The three
# workspace crates depend on each other that way, which is the normal spelling
# and not what the rule above is about.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
