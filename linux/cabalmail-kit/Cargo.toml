[package]
name = "cabalmail-kit"
description = "Shared, GUI-free core of the Cabalmail Linux client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# This crate must never gain a GTK, libadwaita, or WebKit dependency, directly
# or transitively — that is what lets its tests run on a bare runner with no
# display server. CI enforces it (Phase 2, work item 6).
[dependencies]
directories = "6"
# rustls on aws-lc-rs, verifying against the system trust store through
# rustls-platform-verifier. Nothing links the system OpenSSL, so the packages
# need no TLS library; aws-lc-sys builds with the C compiler alone.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml_edit = "0.25"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net"] }
wiremock = "0.6"
