[package]
name = "cabalmail-kit"
description = "Shared, GUI-free core of the Cabalmail Linux client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# This crate must never gain a GTK, libadwaita, or WebKit dependency, directly
# or transitively — that is what lets its tests run on a bare runner with no
# display server. CI enforces it (Phase 2, work item 6).
[dependencies]
directories = "6"
# TLS through the system OpenSSL rather than rustls: the distributions this
# client is packaged for patch OpenSSL and ship the trust store it reads, and
# neither aws-lc-rs nor ring would clear deny.toml's licence list unamended.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml_edit = "0.25"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net"] }
wiremock = "0.6"
