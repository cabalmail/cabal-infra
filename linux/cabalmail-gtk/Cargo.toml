[package]
name = "cabalmail-gtk"
description = "GTK4 + libadwaita desktop client for Cabalmail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The crate is `cabalmail-gtk`; the installed binary is `cabalmail`, which is
# what the man page, the .desktop file, and the CLI (`cabalmail --print-config`)
# all refer to.
[[bin]]
name = "cabalmail"
path = "src/main.rs"

# GTK4, libadwaita, WebKitGTK, tokio, and the `cabalmail-kit` dependency arrive
# with the application shell (Phase 1, work item 4).
[dependencies]
